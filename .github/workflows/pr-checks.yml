  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # The interaction suites (web/e2e: the table-state matrix and the scripted-socket
  # client checks) drive the built app in headless Chromium. Non-blocking while its
  # known list, made on macOS, settles on Linux fonts: a failure shows as a warning
  # and the job summary, and the screenshots are uploaded. The live flows need the
  # game server and are not run here (`npm run e2e:full` locally).
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Playwright 1.58 ships no Chromium build for the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install headless Chromium and its system libraries
        run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run build
      - name: Interaction suites (matrix + client)
        id: e2e
        continue-on-error: true
        run: npm run e2e
      - name: Summary
        if: always()
        run: |
          echo "e2e outcome: ${{ steps.e2e.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          for f in e2e/out/matrix.json e2e/out/client.json; do
            [ -f "$f" ] || continue
            node -e 'const r=require("./"+process.argv[1]); console.log(`- ${r.suite}: ${r.checks} checks, ${r.failed} failed, ${r.known} known, ${r.stale.length} stale known, ${Math.round(r.seconds)} s`)' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: steps.e2e.outcome == 'failure'
        with:
          name: e2e-out
          path: web/e2e/out
          retention-days: 14
