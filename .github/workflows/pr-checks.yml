name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every push to main runs to
# completion: its group is its own sha, so a later merge neither cancels it nor
# replaces it while it waits.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path classification for the heavy jobs. A push to main always runs the full
  # suite. On a pull request, `code` is false only when every changed path is
  # documentation; `luna`, `train` and `search` are false only when no changed
  # path can reach that job; `server_full` is false when every code path is
  # under web/, and then `server_web_only` runs just the server test modules
  # that read web/ files (server-web); `web` is true when a path under web/ (or
  # this workflow) changed. Any error, or an empty diff, runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      web: ${{ steps.classify.outputs.web }}
      luna: ${{ steps.classify.outputs.luna }}
      train: ${{ steps.classify.outputs.train }}
      search: ${{ steps.classify.outputs.search }}
      server_full: ${{ steps.classify.outputs.server_full }}
      server_web_only: ${{ steps.classify.outputs.server_web_only }}
      server_web_pure: ${{ steps.classify.outputs.server_web_pure }}
      server_web_compiled: ${{ steps.classify.outputs.server_web_compiled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pytest jobs below may be skipped, so the review-ledger guard that
      # server/tests/conftest.py runs in every pytest session also runs here,
      # unconditionally and outside the classifier's fallback: the literal PR
      # head ledger must extend the literal base ledger byte for byte. It reads
      # the event payload exactly as conftest does and returns on non-PR events.
      - name: Review ledger guard
        working-directory: server/tests
        run: python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "."); from review_ledger_guard import enforce_pr_head_extends_base; enforce_pr_head_extends_base(Path.cwd().parents[1])'
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys

          # Documentation that no CI job reads. HANDOFF_REVIEW.md is not here:
          # the conftest review-ledger guard checks it on every PR test session.
          DOC_PREFIXES = ("docs/", "docs_archive/", "incidents/")
          WORKFLOW = ".github/workflows/pr-checks.yml"
          TEST_MODULE = re.compile(r"server/tests/test_\w+\.py")

          # The test-module scan and the web-reader rule live in the local gate
          # script, so CI and `affected_tests.py` select the same modules. A failed
          # import raises inside classify(), and everything runs.
          SCRIPTS = os.path.abspath("server/scripts")

          def shared():
              if SCRIPTS not in sys.path:
                  sys.path.insert(0, SCRIPTS)
              import affected_tests
              return affected_tests

          def imported_test_modules(name):
              return shared().imported_test_modules(name)

          def with_helpers(names):
              return shared().with_helpers(names)

          def is_doc(path):
              if path == "HANDOFF_REVIEW.md":
                  return False
              return path.endswith(".md") or path.startswith(DOC_PREFIXES)

          def job_block(job):
              text = open(WORKFLOW).read()
              block = re.search(rf"\n  {job}:\n(.*?)(?=\n  [A-Za-z_-]+:\n|\Z)", text, re.S)
              if not block:
                  raise RuntimeError(f"job {job} not found")
              return block.group(1)

          def luna_test_modules():
              # Test modules the luna-profiles job selects, plus the sibling test
              # modules they import (helpers shared through `from test_x import`).
              names = set(re.findall(r"tests/(test_\w+)\.py", job_block("luna-profiles")))
              if not names:
                  raise RuntimeError("no luna-profiles test modules found")
              names = with_helpers(names)
              return {f"server/tests/{name}.py" for name in names}

          TRAIN_JOBS = ("train-cwv", "train-policy", "train-deadline")

          def train_inputs():
              # Test modules the train-* jobs select (their run lines and the
              # ci_*_modes.sh scripts they call), the sibling test modules those
              # import, and every web/ file those modules name: a web change
              # reaches the training suites only through such a literal path.
              selection = ""
              for job in TRAIN_JOBS:
                  block = job_block(job)
                  selection += block
                  for script in re.findall(r"scripts/(ci_\w+\.sh)", block):
                      selection += open(f"server/scripts/{script}").read()
              names = set()
              for pattern in re.findall(r"tests/(test_[\w*?]+)\.py", selection):
                  for found in glob.glob(f"server/tests/{pattern}.py"):
                      names.add(os.path.basename(found)[:-3])
              if not names:
                  raise RuntimeError("no train-* test modules found")
              names = with_helpers(names)
              web = set()
              for name in names:
                  source = open(f"server/tests/{name}.py").read()
                  web.update(re.findall(r"""['"/](web/[\w./-]+)""", source))
              return {f"server/tests/{name}.py" for name in names}, web

          API_IMPORT = re.compile(r"shengji\.api\b|from shengji import api\b|from \.\.+api\b")

          def search_inputs():
              # Test modules the search-regression job selects and the sibling test
              # modules they import; whether any of them reads a web/ path; and
              # whether the API package reaches them: imported by one of them, or
              # by a shengji module outside the package.
              names = set(re.findall(r"tests/(test_\w+)\.py", job_block("search-regression")))
              if not names:
                  raise RuntimeError("no search-regression test modules found")
              names = with_helpers(names)
              sources = [open(f"server/tests/{name}.py").read() for name in names]
              reads_web = any(shared().WEB_PATH.search(source) for source in sources)
              api = any(API_IMPORT.search(source) for source in sources)
              for path in glob.glob("server/shengji/**/*.py", recursive=True):
                  if not path.startswith("server/shengji/api/") and API_IMPORT.search(open(path).read()):
                      api = True
              return {f"server/tests/{name}.py" for name in names}, reads_web, api

          def server_selection():
              # Test modules the server job's pure-engine and compiled-engine steps name.
              pure, compiled = set(), set()
              for step in job_block("server").split("\n      - name: ")[1:]:
                  names = set(re.findall(r"tests/(test_\w+)\.py", step))
                  if "--engine compiled" in step:
                      compiled |= names
                  elif "--engine pure" in step:
                      pure |= names
              if not pure or not compiled:
                  raise RuntimeError("server job selection not found")
              return pure, compiled

          def reaches_train(path, train_tests, train_web):
              # The training suites import most of server/shengji (the API server
              # included) and read fixtures and scripts; documentation, web files
              # they never name and other server test modules are out.
              if is_doc(path):
                  return False
              if path.startswith("web/"):
                  return path in train_web
              if TEST_MODULE.fullmatch(path):
                  return path in train_tests
              return True

          def reaches_luna(path, luna_tests):
              # The luna-profiles suites import nearly every shengji package, the
              # scripts package, conftest helpers, fixtures and fly.toml; only
              # documentation, the web client and other server test modules are out.
              if is_doc(path) or path.startswith("web/"):
                  return False
              if TEST_MODULE.fullmatch(path):
                  return path in luna_tests
              return True

          def reaches_search(path, search_tests, search_web, search_api):
              # The search regressions import the engine, the bots and (through
              # the served-bot witnesses) the API server; documentation, the web
              # client when none of them reads it, the API package when nothing
              # they load imports it, and other server test modules are out.
              if is_doc(path):
                  return False
              if path.startswith("web/"):
                  return search_web
              if path.startswith("server/shengji/api/"):
                  return search_api
              if TEST_MODULE.fullmatch(path):
                  return path in search_tests
              return True

          def reaches_web(path):
              # The interaction suites drive the built web client; the workflow runs them.
              return path == WORKFLOW or (path.startswith("web/") and not is_doc(path))

          def reaches_server(path):
              # The server job runs in full for any code path outside web/.
              return not is_doc(path) and not path.startswith("web/")

          def classify_paths(paths):
              # Outputs for a pull request's changed paths. server_web_only: every
              # code path is under web/, so the server job is replaced by the
              # server test modules that read web/ files (`plan_for`), each in the
              # engine mode(s) the server job runs it in; a module the server job
              # does not select runs in pure mode.
              luna_tests = luna_test_modules()
              train_tests, train_web = train_inputs()
              search_tests, search_web, search_api = search_inputs()
              code = any(not is_doc(path) for path in paths)
              server_full = any(reaches_server(path) for path in paths)
              out = {
                  "code": code,
                  "web": any(reaches_web(path) for path in paths),
                  "luna": any(reaches_luna(path, luna_tests) for path in paths),
                  "train": any(reaches_train(path, train_tests, train_web) for path in paths),
                  "search": any(reaches_search(path, search_tests, search_web, search_api) for path in paths),
                  "server_full": server_full,
                  "server_web_only": code and not server_full,
                  "server_web_pure": [],
                  "server_web_compiled": [],
              }
              if out["server_web_only"]:
                  plan = shared().plan_for([path for path in paths if not is_doc(path)])
                  wanted = sorted(set(plan.pure) | set(plan.compiled))
                  if not wanted:
                      raise RuntimeError("a web change selected no server test module")
                  pure, compiled = server_selection()
                  out["server_web_pure"] = [name for name in wanted if name in pure or name not in compiled]
                  out["server_web_compiled"] = [name for name in wanted if name in compiled]
              for path in paths:
                  print(f"{'doc ' if is_doc(path) else 'code'} "
                        f"{'luna' if reaches_luna(path, luna_tests) else '    '} "
                        f"{'train' if reaches_train(path, train_tests, train_web) else '     '} "
                        f"{'search' if reaches_search(path, search_tests, search_web, search_api) else '      '} "
                        f"{'server' if reaches_server(path) else '      '} {path}")
              return out

          EVERYTHING = {"code": True, "web": True, "luna": True, "train": True, "search": True,
                        "server_full": True, "server_web_only": False,
                        "server_web_pure": [], "server_web_compiled": []}

          def classify():
              if os.environ["EVENT_NAME"] != "pull_request":
                  return dict(EVERYTHING), "not a pull request"
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              out = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", f"{base}...{head}"],
                  check=True, capture_output=True, text=True).stdout
              paths = [line for line in out.splitlines() if line]
              if not paths:
                  return dict(EVERYTHING), "empty diff"
              return classify_paths(paths), f"{len(paths)} changed paths"

          def output_lines(result):
              lines = []
              for key, value in result.items():
                  if isinstance(value, bool):
                      lines.append(f"{key}={str(value).lower()}")
                  else:
                      lines.append(f"{key}={' '.join(f'tests/{name}.py' for name in value)}")
              return lines

          try:
              result, why = classify()
          except Exception as error:
              result, why = dict(EVERYTHING), f"classification failed, running everything: {error!r}"
          lines = output_lines(result)
          print(" ".join(line for line in lines if "=tests/" not in line) + f" ({why})")
          for line in lines:
              if "=tests/" in line:
                  print(line)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/stdout"), "a") as output:
              output.write("".join(f"{line}\n" for line in lines))
          PY

  test-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every server/tests/**/test_*.py must be selected by a job below or listed,
      # with a reason, in server/tests/ci_selection_exclusions.txt (a ratchet).
      - name: Check every test module is selected by a CI job
        run: python3 server/scripts/check_ci_test_selection.py
      # Lane shell scripts: no ls-glob counts piped to wc; launchers under server/scripts/lanes source lane_lib.sh.
      - name: Check lane scripts
        if: ${{ !cancelled() }}
        run: python3 server/scripts/check_lane_scripts.py

  comment-provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Added comment, docstring and help-string lines under server/shengji,
      # server/scripts and web/src carry no attribution, issue labels, history or banners.
      - name: Check added comments for provenance
        run: python3 server/scripts/check_comment_provenance.py --base ${{ github.event.pull_request.base.sha }}
      # Added lines in AI_POLICIES.md, RL_PLAN.md, README.md and DEPLOY.md state no absolute
      # claim without an interval and name no stale release as the current comparator.
      - name: Check added doc lines for absolute claims and stale comparators
        if: ${{ !cancelled() }}
        run: python3 server/scripts/check_doc_claims.py --base ${{ github.event.pull_request.base.sha }}
      # A branch that adds a component under web/src/{components,queue,home} or changes a list in
      # web/src/flows.test.ts also edits docs/design/FLOWS.md or the core mock, unless the PR body
      # or a commit message says 'flow-ok: <reason>'. The body goes through env, never into the script.
      - name: Check UI flow changes against the flow map
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 server/scripts/check_flow_map.py --base ${{ github.event.pull_request.base.sha }} --body-env PR_BODY

  server:
    needs: changes
    if: needs.changes.outputs.server_full == 'true'
    runs-on: ubuntu-latest
    # Five shards side by side, balanced by measured per-file time: `pure-1`
    # to `pure-3` each run a third of the core suite (pure-3 also the Sol
    # benchmark contracts); `compiled-1` runs compiled parity and the release
    # manifests; `compiled-2` loads the production package on this tree. Both
    # compiled shards fetch every pinned package. Each module of the core
    # suite is in exactly one part, so the engine modes each module runs in
    # are unchanged.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [pure-1, pure-2, pure-3, compiled-1, compiled-2]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test core server behavior in pure mode (part 1 of 3)
        if: matrix.shard == 'pure-1'
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_test_checkout_reexec.py
          tests/test_release_ladder.py
          tests/test_prepared_panel_runner.py
          tests/test_sol_release_gate.py
          tests/test_engine_parity.py
          tests/test_pybot_inputs.py
          tests/test_saved_games_api.py
          tests/test_saved_games_resume.py
          tests/test_support.py
          tests/test_chat_filter.py
          tests/test_player_reports.py
          tests/test_matchmaking_golden.py
          tests/test_web_cache_headers.py
          tests/test_oracle_screen.py
          tests/test_report_world_reuse.py
          tests/test_served_config.py
          tests/test_check_ci_test_selection.py
          tests/test_check_flow_map.py
          tests/test_check_doc_claims.py
          tests/test_check_lane_scripts.py
          tests/test_affected_tests.py
          tests/test_pv_exact_follow.py
      - name: Test core server behavior in pure mode (part 2 of 3)
        if: matrix.shard == 'pure-2'
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_test_checkout.py
          tests/test_decision_diagram.py
          tests/test_prepare_llm_panel_roots.py
          tests/test_panel_root_import.py
          tests/test_launch_sol_recovery.py
          tests/test_sol_recovery_memory_wait.py
          tests/test_sealed_panel_reader.py
          tests/test_sealed_readout_wrapper.py
          tests/test_offline_bot.py
          tests/test_bot_scheduler.py
          tests/test_server_ws.py
          tests/test_health_activity.py
          tests/test_accounts.py
          tests/test_apple_signin.py
          tests/test_saved_games_link.py
          tests/test_matchmaking.py
          tests/test_table_frame.py
          tests/test_harvest_trajectory.py
          tests/test_human_pointer_attribution.py
          tests/test_harvest_ballot_capture.py
          tests/test_bury_fly_config.py
          tests/test_ci_review_ledger_step.py
          tests/test_safe_rm.py
          tests/test_pr_ship.py
          tests/test_client_server_constants.py
          tests/test_ops_dashboard.py
          tests/test_seed_windows_dir.py
          tests/test_fast_parity.py
      - name: Test core server behavior in pure mode (part 3 of 3)
        if: matrix.shard == 'pure-3'
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_production_package_gate.py
          tests/test_search_models.py
          tests/test_panel_forfeit_alignment.py
          tests/test_panel_memory_reader.py
          tests/test_production_llm_panel_readout.py
          tests/test_production_llm_panel.py
          tests/test_launch_production_llm_panel.py
          tests/test_sol_linux_memory_guard.py
          tests/test_stage1_seal_plan.py
          tests/test_engine.py
          tests/test_heuristic_lowest.py
          tests/test_heuristic_suit_groups.py
          tests/test_prepared_play_error_hook.py
          tests/test_offline_fixture_gen.py
          tests/test_offline_server_fixture_gen.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_memory.py
          tests/test_banker_sampler.py
          tests/test_ratings.py
          tests/test_table_router.py
          tests/test_telemetry.py
          tests/test_deploy_web_only.py
          tests/test_hybrid_duel_quality.py
          tests/test_room_bot_seed.py
          tests/test_structured_bury.py
          tests/test_mc_benchmark_normalization.py
          tests/test_release46_fly_config.py
          tests/test_release48_fly_config.py
          tests/test_release49_fly_config.py
          tests/test_release50_fly_config.py
          tests/test_release51_fly_config.py
          tests/test_release52_fly_config.py
          tests/test_expert_label_producer.py
          tests/test_expert_label_check.py
          tests/test_check_comment_provenance.py
          tests/test_lane_lib.py
          tests/test_ci_path_classifier.py
          tests/test_receipt_summary.py
          tests/test_mistake_dashboard.py
          tests/test_paired_window_stats.py
          tests/test_comparator_bank.py
      # New modules in these families are selected without editing this list.
      - name: Test Sol benchmark contracts in pure mode
        if: matrix.shard == 'pure-3'
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_benchmark_*.py
          tests/test_llm_benchmark_*.py
      # Every test module importing the engine boundary must also run here (or in
      # another compiled step); check_ci_test_selection.py enforces it (#888, #891).
      - name: Test compiled engine and policy parity
        if: matrix.shard == 'compiled-1'
        env:
          SHENGJI_FAST: "1"
        run: >-
          uv run python scripts/test_checkout.py --engine compiled -- -q --durations=10
          tests/test_benchmark_final*.py
          tests/test_stage1_seal_plan.py
          tests/test_mistake_dashboard.py
          tests/test_prepared_panel_runner.py
          tests/test_llm_benchmark_rollouts.py
          tests/test_production_llm_panel_readout.py
          tests/test_llm_benchmark_games.py
          tests/test_benchmark_terminal.py
          tests/test_engine_parity.py
          tests/test_fast_parity.py
          tests/test_offline_fixture_gen.py
          tests/test_offline_server_fixture_gen.py
          tests/test_offline_bot.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_banker_sampler.py
          tests/test_bot_scheduler.py
          tests/test_duel_factories_seeded.py
          tests/test_structured_bury.py
          tests/test_report_world_reuse.py
          tests/test_mc_benchmark_normalization.py
          tests/test_benchmark_legacy_evidence.py
          tests/test_benchmark_rollout_proof.py
          tests/test_llm_benchmark_policy.py
          tests/test_engine.py
          tests/test_heuristic_suit_groups.py
          tests/test_memory.py
          tests/test_harvest_ballot_capture.py
          tests/test_human_pointer_attribution.py
          tests/test_pv_exact_follow.py
      # #636: the served bot must still CONSTRUCT from the real production package on this
      # tree. The package is not in the repo (Jerry 2026-09-28: do not commit it); CI fetches
      # it from the repo's `serving-packages` release by tag and verifies the sha256 pinned
      # here and in the test. A missing or wrong-hash asset FAILS the job -- a required gate
      # that skips itself is indistinguishable from one that passes (#633, #634).
      - name: Fetch the pinned production package
        if: startsWith(matrix.shard, 'compiled')
        env:
          PACKAGE_URL: https://github.com/jerryyyu/shengji/releases/download/serving-packages/smv3out-491ee4bf.npz
          PACKAGE_SHA256: 491ee4bf81abe783d14f1e004d31ceda1ff2679bd2e14b60a5a9fa96b57c2670
        run: |
          set -euo pipefail
          mkdir -p /tmp/shengji-packages
          curl -sSL --fail --retry 6 --retry-all-errors --retry-max-time 120 -o /tmp/shengji-packages/smv3out-491ee4bf.npz "$PACKAGE_URL"
          echo "$PACKAGE_SHA256  /tmp/shengji-packages/smv3out-491ee4bf.npz" | sha256sum -c -
      # The served belief-worlds proposal binds its own hash-pinned package: the same
      # release, the same fail-closed rule.
      - name: Fetch the pinned belief package
        if: startsWith(matrix.shard, 'compiled')
        env:
          PACKAGE_URL: https://github.com/jerryyyu/shengji/releases/download/serving-packages/s17long-e2-763b5e05.npz
          PACKAGE_SHA256: 763b5e0536549404b9b5c3449e2379f7af48a4b59c163928296ee904d4da4343
        run: |
          set -euo pipefail
          mkdir -p /tmp/shengji-packages
          curl -sSL --fail --retry 6 --retry-all-errors --retry-max-time 120 -o /tmp/shengji-packages/s17long-e2-763b5e05.npz "$PACKAGE_URL"
          echo "$PACKAGE_SHA256  /tmp/shengji-packages/s17long-e2-763b5e05.npz" | sha256sum -c -
      # Release 48's belief package (S58); the S17 package above stays for the release-46
      # rollback, which is built on real bytes too.
      - name: Fetch the pinned release-48 belief package
        if: startsWith(matrix.shard, 'compiled')
        env:
          PACKAGE_URL: https://github.com/jerryyyu/shengji/releases/download/serving-packages/s58-e6-42444515.npz
          PACKAGE_SHA256: 424445158f3392b57e40bb23e13a923009d734530d5253958d5c541a0d2a259e
        run: |
          set -euo pipefail
          mkdir -p /tmp/shengji-packages
          curl -sSL --fail --retry 6 --retry-all-errors --retry-max-time 120 -o /tmp/shengji-packages/s58-e6-42444515.npz "$PACKAGE_URL"
