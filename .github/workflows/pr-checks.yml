name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every server/tests/**/test_*.py must be selected by a job below or listed,
      # with a reason, in server/tests/ci_selection_exclusions.txt (a ratchet).
      - name: Check every test module is selected by a CI job
        run: python3 server/scripts/check_ci_test_selection.py

  server:
    runs-on: ubuntu-latest
    # The pure suite alone reached 14m22s on a shared runner; leave room for
    # the compiled parity step too. Durations expose the tail for optimization.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test core server behavior in pure mode
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_test_checkout.py
          tests/test_prepare_llm_panel_roots.py
          tests/test_panel_root_import.py
          tests/test_prepared_panel_runner.py
          tests/test_panel_forfeit_alignment.py
          tests/test_panel_memory_reader.py
          tests/test_production_llm_panel_readout.py
          tests/test_production_llm_panel.py
          tests/test_launch_production_llm_panel.py
          tests/test_launch_sol_recovery.py
          tests/test_sol_recovery_memory_wait.py
          tests/test_sol_linux_memory_guard.py
          tests/test_sol_release_gate.py
          tests/test_sealed_panel_reader.py
          tests/test_sealed_readout_wrapper.py
          tests/test_engine.py
          tests/test_heuristic_lowest.py
          tests/test_prepared_play_error_hook.py
          tests/test_engine_parity.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_memory.py
          tests/test_banker_sampler.py
          tests/test_bot_scheduler.py
          tests/test_server_ws.py
          tests/test_structured_bury.py
          tests/test_harvest_trajectory.py
          tests/test_oracle_screen.py
          tests/test_harvest_ballot_capture.py
          tests/test_report_world_reuse.py
          tests/test_mc_benchmark_normalization.py
          tests/test_bury_fly_config.py
          tests/test_check_ci_test_selection.py
          tests/test_paired_window_metadata.py
          tests/test_refusal_readout_summary.py
          tests/test_v52ec_handoff.py
          tests/test_v52ec_recovery_diagnostics.py
          tests/test_v52ec_recovery_traces.py
          tests/test_v52ec_recovery_reader.py
          tests/test_v52ec_recovery_integration.py
      # New modules in these families are selected without editing this list.
      - name: Test Sol benchmark contracts in pure mode
        run: >-
          uv run python scripts/test_checkout.py --engine pure -- -q --durations=10
          tests/test_benchmark_*.py
          tests/test_llm_benchmark_*.py
      - name: Test compiled engine and policy parity
        env:
          SHENGJI_FAST: "1"
        run: >-
          uv run pytest -q --durations=10
          tests/test_benchmark_final_action_boundary.py
          tests/test_engine_parity.py
          tests/test_fast_parity.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_banker_sampler.py
          tests/test_bot_scheduler.py
          tests/test_duel_factories_seeded.py
          tests/test_structured_bury.py
          tests/test_report_world_reuse.py
          tests/test_mc_benchmark_normalization.py
      # #636: the served bot must still CONSTRUCT from the real production package on this
      # tree. The package is not in the repo (Jerry 2026-09-28: do not commit it); CI fetches
      # it from the repo's `serving-packages` release by tag and verifies the sha256 pinned
      # here and in the test. A missing or wrong-hash asset FAILS the job -- a required gate
      # that skips itself is indistinguishable from one that passes (#633, #634).
      - name: Fetch the pinned production package
        env:
          PACKAGE_URL: https://github.com/jerryyyu/shengji/releases/download/serving-packages/smv3out-491ee4bf.npz
          PACKAGE_SHA256: 491ee4bf81abe783d14f1e004d31ceda1ff2679bd2e14b60a5a9fa96b57c2670
        run: |
          set -euo pipefail
          mkdir -p /tmp/shengji-packages
          curl -sSL --fail --retry 3 -o /tmp/shengji-packages/smv3out-491ee4bf.npz "$PACKAGE_URL"
          echo "$PACKAGE_SHA256  /tmp/shengji-packages/smv3out-491ee4bf.npz" | sha256sum -c -
      - name: Load the production package on this tree
        env:
          SHENGJI_FAST: "1"
          SHENGJI_REQUIRE_PV_PACKAGE: "1"
          SHENGJI_PV_PACKAGE_PATH: /tmp/shengji-packages/smv3out-491ee4bf.npz
        run: uv run pytest -q tests/test_encoder_round_compat.py

  import-walk:
    runs-on: ubuntu-latest
    # This job installs the rl group (torch), builds the engine, walks every
    # module AND runs scripts/ci_cwv_modes.sh; on a shared runner that has been
    # hitting the old 15-minute ceiling (a timeout shows as "cancelled", not
    # "failed"). Give it the same room as the server job.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Import every shengji module
        run: uv run python -P -B -m pytest -q tests/test_import_walk.py
      - name: Test CWV consumers in both engine modes
        run: bash scripts/ci_cwv_modes.sh

  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [pure, compiled]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test production search regressions
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          if [ "${{ matrix.engine }}" = "pure" ]; then
            unset SHENGJI_FAST
          else
            export SHENGJI_FAST=1
          fi
          # Missing torch must not silently skip real-package witnesses;
          # a compiled import fallback must not masquerade as native coverage.
          uv run python -B - <<'PY'
          import os
          import torch
          from shengji.engine import legal
          expected = "shengji.engine._fast" if os.environ.get("SHENGJI_FAST") == "1" else "shengji.engine.legal"
          assert legal.validate_follow.__module__ == expected
          PY
          uv run python -B -m pytest -q --durations=10 \
            tests/test_pv_admission_rules.py \
            tests/test_pair_resource_admission.py \
            tests/test_pair_resource_pipeline.py \
            tests/test_refusal_constraints.py \
            tests/test_pv_tiebreak_points.py \
            tests/test_pv_lead_anchor.py \
            tests/test_pv_tree_search.py \
            tests/test_pv_search_serving.py \
            tests/test_pv_search_hooks.py \
            tests/test_pv_value_matrix.py \
            tests/test_pv_adaptive_k.py \
            tests/test_pv_lead_tiebreak_prior.py \
            tests/test_pv_doomed_throw_swap.py \
            tests/test_pv_search_bury.py \
            tests/test_pv_search_prior_package.py \
            tests/test_pv_serving_smoke.py \
            tests/test_pv_refusal_event_complete.py \
            tests/test_pv_sampler_telemetry.py

  luna-profiles:
    runs-on: ubuntu-latest
    # Each shard also runs the shared observation/ballot suite; the CLI shard
    # reached 10 min with no test failing (#805, #809 on 2026-10-05).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tests:
          - "tests/test_luna_attempt.py tests/test_luna_supervisor.py"
          - "tests/test_luna_cli.py tests/test_luna_transport.py"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test Luna collector prompt profiles
        env:
          SHENGJI_FAST: "1"
        run: uv run pytest -q ${{ matrix.tests }}
      - name: Install locked observation-test dependencies
        if: matrix.tests == 'tests/test_luna_cli.py tests/test_luna_transport.py'
        run: uv sync --frozen --group dev --group rl
      - name: Test observation evidence and process containment
        if: matrix.tests == 'tests/test_luna_cli.py tests/test_luna_transport.py'
        run: >-
          uv run python -B -m pytest -q --durations=10
          tests/test_observation_opportunity_integration.py
          tests/test_ballot_selection.py
          tests/test_ballot_matrix.py
          tests/test_ballot_full_pool.py
          tests/test_ballot_points_selection.py
          tests/test_fixed_tape_capture.py
          tests/test_fixed_tape_policy.py
          tests/test_s11_report_integration.py
          tests/test_s11_report_summary.py
          tests/test_s11_collection.py
          tests/test_s11_reconstruction.py
          tests/test_s11_public_view.py
          tests/test_s11_shard.py
          tests/test_s11_selection.py
          tests/test_s11_manifest.py
          tests/test_s11_input_join.py
          tests/test_fixed_tape_panel.py
          tests/test_public_fixture_panel.py
          tests/test_m9_replay_binding.py
          tests/test_m9_panel_plan.py
          tests/test_m9_capacity_timing.py
          tests/test_m9_panel_recipe.py
          tests/test_m9_panel_inputs.py
          tests/test_m9_panel_execution.py
          tests/test_m9_panel_admission.py
          tests/test_m9_panel_authenticated_worker.py
          tests/test_m9_panel_factory_preflight.py
          tests/test_observation_queue_m9.py
          tests/test_m9_panel_worker.py
          tests/test_m9_panel_persistence.py
          tests/test_m9_panel_readout.py
          tests/test_m9_panel_completion.py
          tests/test_m9_panel_artifact_reader.py
          tests/test_selected_panel_reader.py
          tests/test_panel_rank_root.py
          tests/test_panel_rank_worker.py
          tests/test_panel_rank_worker_reader_integration.py
          tests/test_panel_rank_worker_authenticated_integration.py
          tests/test_panel_rank_worker_isolated_integration.py
          tests/test_m9_panel_publication.py
          tests/test_m9_panel_readout_worker.py
          tests/test_m9_readout_persistence_roundtrip.py
          tests/test_observation_summary.py
          tests/test_observation_partial_evidence.py
          tests/test_tactical_public_observations.py
          tests/test_public_refusal_history.py
          tests/test_observation_process.py
          tests/test_observation_process_cli.py
          tests/test_observation_recipe.py
          tests/test_observation_numeric_recipe.py
          tests/test_observation_control_rejections.py
          tests/test_observation_lease.py
          tests/test_observation_runtime.py
          tests/test_observation_runtime_fence.py
          tests/test_observation_queue.py
          tests/test_observation_worker.py
          tests/test_observation_admission.py
          tests/test_luna_startup_cleanup.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
