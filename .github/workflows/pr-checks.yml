  luna-profiles:
    needs: changes
    if: needs.changes.outputs.luna == 'true'
    runs-on: ubuntu-latest
    # Each shard also runs one half of the shared observation/ballot suite,
    # split by measured per-file time; the CLI shard reached 10 min with no
    # test failing when it ran the whole suite (#805, #809).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tests:
          - "tests/test_luna_attempt.py tests/test_luna_supervisor.py"
          - "tests/test_luna_cli.py tests/test_luna_transport.py"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      # Install every group BEFORE the parallel block: a uv sync while a test step
      # is importing from the same venv would race it.
      - name: Install locked observation-test dependencies
        run: uv sync --frozen --group dev --group rl
      # conftest's review-ledger guard fetches the PR base/head commits when they are
      # missing; two pytest sessions starting together would race on the same .git.
      # Fetch them once here so the guard finds both locally (the check itself is unchanged).
      - name: Prefetch PR base and head for the review-ledger guard
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      # The two suites are independent single-process pytest runs (one CPU each on
      # the two-core runner), so run them as parallel steps (GitHub Actions
      # `parallel`). -p no:cacheprovider keeps the two sessions from writing the
      # same .pytest_cache.
      - parallel:
          - name: Test Luna collector prompt profiles
            env:
              SHENGJI_FAST: "1"
            run: uv run pytest -q -p no:cacheprovider ${{ matrix.tests }}
          - name: Test observation evidence and process containment (part 1 of 2)
            if: matrix.tests == 'tests/test_luna_attempt.py tests/test_luna_supervisor.py'
            run: >-
              uv run python -B -m pytest -q -p no:cacheprovider --durations=10
              tests/test_s11_report_integration.py
              tests/test_s11_model.py
              tests/test_s11_persistence.py
              tests/test_s11_phases.py
              tests/test_s11_collection_phase.py
              tests/test_s11_host_phase.py
              tests/test_sealed_s11_readout.py
              tests/test_s11_inventory.py
              tests/test_s11_reconstruction.py
              tests/test_s11_manifest.py
              tests/test_s11_input_join.py
              tests/test_s11_inputs.py
              tests/test_s11_admission_once.py
              tests/test_s11_staging.py
              tests/test_s11_input_phase.py
              tests/test_m9_panel_execution.py
              tests/test_m9_panel_admission.py
              tests/test_m9_panel_persistence.py
              tests/test_panel_rank_root.py
              tests/test_panel_rank_worker_reader_integration.py
              tests/test_panel_rank_worker_authenticated_integration.py
              tests/test_panel_rank_worker_isolated_integration.py
              tests/test_m9_panel_publication.py
              tests/test_observation_partial_evidence.py
              tests/test_public_refusal_history.py
