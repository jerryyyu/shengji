name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every push to main runs to
# completion: its group is its own sha, so a later merge neither cancels it nor
# replaces it while it waits.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Test selection for the heavy jobs. A push to main (or a manual dispatch)
  # runs every module. On a pull request, server/scripts/ci/select_tests.py
  # maps the changed paths through the import graph of server/ and tools/ to
  # the test modules they can reach (`selected`, space-separated; `all` when a
  # run-everything path changed or the selection failed), and `jobs` says for
  # each job whether any module it runs is selected. Every pytest session
  # reads SHENGJI_CI_SELECTED and skips the modules outside it. `code` is
  # false only when every changed path is documentation; `web` is true when a
  # path under web/ (or this workflow) changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
      web: ${{ steps.select.outputs.web }}
      selected: ${{ steps.select.outputs.selected }}
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pytest jobs below may be skipped, so the review-ledger guard that
      # server/tests/conftest.py runs in every pytest session also runs here,
      # unconditionally and outside the selector's fallback: the literal PR
      # head ledger must extend the literal base ledger byte for byte. It reads
      # the event payload exactly as conftest does and returns on non-PR events.
      - name: Review ledger guard
        working-directory: server/tests
        run: python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "."); from review_ledger_guard import enforce_pr_head_extends_base; enforce_pr_head_extends_base(Path.cwd().parents[1])'
      - name: Select test modules
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 server/scripts/ci/select_tests.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            python3 server/scripts/ci/select_tests.py --all --github-output "$GITHUB_OUTPUT"
          fi

  test-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every server/tests/**/test_*.py must be selected by a job below or listed,
      # with a reason, in server/tests/ci_selection_exclusions.txt (a ratchet).
      - name: Check every test module is selected by a CI job
        run: python3 server/scripts/check_ci_test_selection.py
      # Lane shell scripts: no ls-glob counts piped to wc; launchers under server/scripts/lanes source lane_lib.sh.
      - name: Check lane scripts
        if: ${{ !cancelled() }}
        run: python3 server/scripts/check_lane_scripts.py

  comment-provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Added comment, docstring and help-string lines under server/shengji,
      # server/scripts and web/src carry no attribution, issue labels, history or banners.
      - name: Check added comments for provenance
        run: python3 server/scripts/check_comment_provenance.py --base ${{ github.event.pull_request.base.sha }}
      # Added lines in AI_POLICIES.md, RL_PLAN.md, README.md and DEPLOY.md state no absolute
      # claim without an interval and name no stale release as the current comparator.
      - name: Check added doc lines for absolute claims and stale comparators
        if: ${{ !cancelled() }}
        run: python3 server/scripts/check_doc_claims.py --base ${{ github.event.pull_request.base.sha }}
      # A branch that adds a component under web/src/{components,queue,home} or changes a list in
      # web/src/flows.test.ts also edits docs/design/FLOWS.md or the core mock, unless the PR body
      # or a commit message says 'flow-ok: <reason>'. The body goes through env, never into the script.
      - name: Check UI flow changes against the flow map
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 server/scripts/check_flow_map.py --base ${{ github.event.pull_request.base.sha }} --body-env PR_BODY

  # The server suites, split by recorded per-module time (shard_plan.py;
  # server/scripts/ci/test_durations.json). `pure` jobs run the core suite in
  # pure mode; `compiled` jobs run the compiled-parity list, the production
  # package load and the release manifests on the pinned packages. Every pytest
  # command below runs its whole list in every job, as concurrent sessions
  # (parallel.py), and each session keeps its own piece of the plan, so each
  # selected module runs once per command, in the engine mode it names.
  server:
    needs: changes
    if: needs.changes.outputs.selected == 'all' || fromJSON(needs.changes.outputs.jobs)['server']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHENGJI_CI_SELECTED: ${{ needs.changes.outputs.selected }}
      SHENGJI_CI_DURATIONS_OUT: ${{ github.workspace }}/ci-durations
    strategy:
      fail-fast: false
      matrix:
        kind: [pure, compiled]
        shard: [1, 2]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      # Concurrent pytest sessions each run the review-ledger guard, which
      # fetches the PR base when it is missing; running it once here first
      # leaves it present, so the sessions never race on git.
      - name: Review ledger guard (fetches the PR base once)
        working-directory: server/tests
        run: python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "."); from review_ledger_guard import enforce_pr_head_extends_base; enforce_pr_head_extends_base(Path.cwd().parents[1])'
      - name: Test core server behavior in pure mode
        if: matrix.kind == 'pure'
        run: >-
          python3 scripts/ci/parallel.py --sessions 2 --shard ${{ matrix.shard }} --shards 2 --
          uv run python scripts/test_checkout.py --engine pure -- -q -p no:cacheprovider --durations=10
          tests/test_test_checkout_reexec.py
          tests/test_release_ladder.py
