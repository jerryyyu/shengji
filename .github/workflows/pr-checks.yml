  # A pull request that changes only web/ and documentation runs, instead of the
  # server job, the server test modules that read web/ files: the changes job
  # lists them with the rule affected_tests.py applies locally, split by the
  # engine mode(s) the server job runs each in. Every listed module reads a
  # literal web/ path (committed offline fixtures the web client replays, the
  # client/server constants, the web cache headers, the comment and flow-map
  # rules over web/src), so none is trimmed; the two engine modes run on
  # separate runners side by side instead of one after the other.
  server-web:
    needs: changes
    if: needs.changes.outputs.server_web_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [pure, compiled]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test web-reading server modules in pure mode
        if: matrix.engine == 'pure' && needs.changes.outputs.server_web_pure != ''
        env:
          TESTS: ${{ needs.changes.outputs.server_web_pure }}
        run: uv run python scripts/test_checkout.py --engine pure -- -q --durations=10 $TESTS
      - name: Test web-reading server modules in compiled mode
        if: matrix.engine == 'compiled' && needs.changes.outputs.server_web_compiled != ''
        env:
          SHENGJI_FAST: "1"
          TESTS: ${{ needs.changes.outputs.server_web_compiled }}
        run: uv run python scripts/test_checkout.py --engine compiled -- -q --durations=10 $TESTS

