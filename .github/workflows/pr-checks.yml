  import-walk:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Import every shengji module
        run: uv run python -P -B -m pytest -q tests/test_import_walk.py

  # The training-pipeline suites. train-cwv runs both engine modes of the
  # CWV consumers side by side (one session per mode per job), each mode's
  # modules split across the shards by recorded time. A timeout shows as
  # "cancelled", not "failed".
  train-cwv:
    needs: changes
    if: needs.changes.outputs.selected == 'all' || fromJSON(needs.changes.outputs.jobs)['train-cwv']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHENGJI_CI_SELECTED: ${{ needs.changes.outputs.selected }}
      SHENGJI_CI_DURATIONS_OUT: ${{ github.workspace }}/ci-durations
      SHENGJI_REQUIRE_VOIDS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      # Concurrent pytest sessions each run the review-ledger guard, which
      # fetches the PR base when it is missing; running it once here first
      # leaves it present, so the sessions never race on git.
      - name: Review ledger guard (fetches the PR base once)
        working-directory: server/tests
        run: python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "."); from review_ledger_guard import enforce_pr_head_extends_base; enforce_pr_head_extends_base(Path.cwd().parents[1])'
      - parallel:
          - name: Test CWV consumers in pure mode
            run: env -u SHENGJI_FAST python3 scripts/ci/parallel.py --shard ${{ matrix.shard }} --shards 3 -- uv run python -B -m pytest -q -p no:cacheprovider --durations=20 tests/test_*cwv*.py tests/test_encoder_bytes_golden.py
          - name: Test CWV consumers in compiled mode
            run: SHENGJI_FAST=1 python3 scripts/ci/parallel.py --shard ${{ matrix.shard }} --shards 3 -- uv run python -B -m pytest -q -p no:cacheprovider --durations=20 tests/test_*cwv*.py tests/test_encoder_bytes_golden.py
      - name: Upload recorded test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ github.job }}-${{ strategy.job-index }}
          path: ci-durations
          if-no-files-found: ignore
          retention-days: 30

