name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test core server behavior in pure mode
        run: >-
          env -u SHENGJI_FAST uv run pytest -q
          tests/test_engine.py
          tests/test_engine_parity.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_memory.py
          tests/test_banker_sampler.py
          tests/test_bot_scheduler.py
          tests/test_server_ws.py
          tests/test_point_banking.py
          tests/test_structured_bury.py
          tests/test_harvest_ballot_capture.py
      - name: Test compiled engine and policy parity
        env:
          SHENGJI_FAST: "1"
        run: >-
          uv run pytest -q
          tests/test_engine_parity.py
          tests/test_fast_parity.py
          tests/test_action_semantics.py
          tests/test_game.py
          tests/test_banker_sampler.py
          tests/test_bot_scheduler.py
          tests/test_duel_factories_seeded.py
          tests/test_point_banking.py
          tests/test_structured_bury.py

  luna-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tests:
          - "tests/test_luna_attempt.py tests/test_luna_supervisor.py"
          - "tests/test_luna_cli.py tests/test_luna_transport.py"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      - name: Test Luna collector prompt profiles
        env:
          SHENGJI_FAST: "1"
        run: uv run pytest -q ${{ matrix.tests }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
