      - name: Import every shengji module
        run: uv run python -P -B -m pytest -q tests/test_import_walk.py

  # The training-pipeline suites, one job each so they run side by side. They
  # run when a change can reach them (the changes job's `train` output): any
  # server path except other test modules, plus the web files they read.
  train-cwv:
    needs: changes
    if: needs.changes.outputs.train == 'true'
    runs-on: ubuntu-latest
    # Both engine modes of about 1,400 tests, one core each, in two shards
    # balanced by measured per-file time (a pure session of the whole
    # selection took about 19 minutes); ci_cwv_modes.sh puts every module in
    # exactly one shard. A timeout shows as "cancelled", not "failed".
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development and RL environment
        run: python -m pip install uv==0.10.4 && uv sync --frozen --group dev --group rl
      - name: Build compiled engine
        run: uv run python setup.py build_ext --inplace
      # The two engine modes start at once and each pytest session's ledger
      # guard fetches the PR base when it is missing; running the guard here
      # first leaves it present, so the concurrent sessions never race on git.
      - name: Review ledger guard (fetches the PR base once)
        working-directory: server/tests
        run: python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "."); from review_ledger_guard import enforce_pr_head_extends_base; enforce_pr_head_extends_base(Path.cwd().parents[1])'
      - name: Test CWV consumers in both engine modes (shard ${{ matrix.shard }} of 2)
        run: bash scripts/ci_cwv_modes.sh ${{ matrix.shard }}

  train-policy:
    needs: changes
