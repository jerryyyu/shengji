      </div>
    </section>
    <section style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 70px">
  <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #f2c14e; margin-bottom: -6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>Ranked</div>

    <a href="#" style="width: 92px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; background: transparent; border: 1.5px solid #d6a22c; font-size: 17px; font-weight: 700; color: #f2c14e">Duo</a>

  <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2; margin-bottom: -6px">Casual</div>

    <a href="#" style="display: flex; align-items: center; min-height: 50px; padding: 0 16px; color: #e9ecf2;"><span style="flex-grow: 1; font-size: 17px">Play bots</span><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#6b7484" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6-6 6"></path></svg></a>
  </div>
  <div style="display: flex; gap: 10px">
    <input id="s-code" aria-label="Room or duo code" placeholder="CODE" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #333b49; background: #0f131a; color: #e9ecf2; font-size: 20px; font-weight: 700; letter-spacing: 0.35em; text-align: center">

  </div>
      <div style="display: flex; justify-content: center; padding-top: 4px"><a href="#" style="font-size: 15px">How to play</a></div>
