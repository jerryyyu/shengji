<rect x="24.0" y="168.0" width="952.0" height="322.0" rx="8" class="panelbox"/>
<text x="40.0" y="194.0" class="hdr">INSIDE ONE DUEL · example cbaC, a confirmation vs release 49</text>
<rect x="40.0" y="262.0" width="96.0" height="44.0" rx="4" class="cand"/>
<text x="88.0" y="281.0" class="b" text-anchor="middle">one deal</text>
<text x="88.0" y="298.0" class="sm mut" text-anchor="middle">same cards</text>
