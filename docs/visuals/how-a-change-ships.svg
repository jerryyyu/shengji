 4}.stage{fill:#1d242c;stroke:#aab8c8;stroke-width:1.4}.stagej{fill:#2b3642;stroke:#aab8c8;stroke-width:1.4}.lineink{stroke:#e6ebf0;stroke-width:2.2;fill:none}.linemut{stroke:#98a4b0;stroke-width:1.2;fill:none}.linebel{stroke:#b39cf0;stroke-width:2.2;fill:none}.linevd{stroke:#7fb8ef;stroke-width:2.2;fill:none}.linewd{stroke:#aab8c8;stroke-width:2.2;fill:none}.lineex{stroke:#ef8fbe;stroke-width:2.2;fill:none}.linenet{stroke:#4fc1b9;stroke-width:2.2;fill:none}.chipt{font-size:12.5px;font-weight:700;letter-spacing:.05em;fill:#1d242c}.netbox{fill:#173f3d;stroke:#4fc1b9;stroke-width:1.5}.netlayer{stroke:#4fc1b9;stroke-width:3;stroke-linecap:round}.netwire{stroke:#4fc1b9;stroke-width:0.8;opacity:.6}.cardatt{fill:#1d242c;stroke:#e07a6c;stroke-width:1.3}.cone{fill:#323c47;fill-opacity:.35}.conel{stroke:#98a4b0;stroke-width:1;stroke-dasharray:3 3;fill:none}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
