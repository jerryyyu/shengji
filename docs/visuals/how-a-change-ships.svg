<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="How a change ships: idea, cheap DEV test with a predeclared bar, screen, fresh-seed confirmation when Jerry or the packet requires it, latency and memory gate on one core, reviewed release PR with green CI, deploy on Jerry&#x27;s word, post-deploy Fly check. In a screen the candidate and the current release each play the same fixed MC-LCB control over 10 windows of 520 clusters; example v92c: candidate +0.540 [+0.521, +0.560], release 45 +0.312 [+0.291, +0.332] levels per round vs the control, difference +0.228 [+0.205, +0.252], positive because the lower bound is above zero. The control scales the two arms of one screen; ladder rows are separate contrasts and are not additive.">
