<text x="730.0" y="418.0" class="sm mut" text-anchor="middle">+0.04</text>
<line x1="800.0" y1="234.0" x2="800.0" y2="400.0" class="grid"/>
<text x="800.0" y="418.0" class="sm mut" text-anchor="middle">+0.06</text>
<line x1="870.0" y1="234.0" x2="870.0" y2="400.0" class="grid"/>
<text x="870.0" y="418.0" class="sm mut" text-anchor="middle">+0.08</text>
<line x1="940.0" y1="234.0" x2="940.0" y2="400.0" class="grid"/>
<text x="940.0" y="418.0" class="sm mut" text-anchor="middle">+0.10</text>
<line x1="607.5" y1="234.0" x2="607.5" y2="400.0" class="conel"/>
<text x="613.5" y="392.0" class="sm mut">mean bar +0.005</text>
<line x1="767.4" y1="300.0" x2="845.2" y2="300.0" class="lineink"/>
<line x1="767.4" y1="293.0" x2="767.4" y2="307.0" class="lineink"/>
<line x1="845.2" y1="293.0" x2="845.2" y2="307.0" class="lineink"/>
<circle cx="806.3" cy="300.0" r="6" class="inkf"/>
<text x="806.3" y="280.0" class="mono b" text-anchor="middle">+0.0618 [+0.0507, +0.0729]</text>
<text x="806.3" y="328.0" class="sm mut" text-anchor="middle">7,840 fresh deals · 95% CI</text>
<rect x="560.0" y="440.0" width="104.0" height="22.0" rx="11" class="net"/>
<text x="612.0" y="455.5" class="chipt" text-anchor="middle">CONFIRMED</text>
<text x="676.0" y="456.0" class="sm">mean ≥ +0.005 and 95% lower bound &gt; 0</text>
<text x="24.0" y="520.0" class="sm">Duel rows and the older MC-LCB windows rows are different instruments. Ladder rows are separate contrasts; they do not add.</text>
<text x="24.0" y="540.0" class="sm mut">A screen PASS earns a confirmation or a place in a combination; release needs a confirmed duel, Fly timing and Jerry&#x27;s word.</text>
<text x="984.0" y="570.0" class="mut sm" text-anchor="end">release 49 · 2026-11-04 · docs/visuals/how-a-change-ships.svg</text>
