<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="How a change ships: idea with a board row, cheap DEV test with a predeclared bar, screen duel of 3,920 seat-swapped deals, confirmation duel of 7,840 fresh deals, latency and memory gate on one core, reviewed release PR with green CI, deploy on Jerry&#x27;s word, post-deploy Fly check. In a duel the candidate plays the served release head to head: each deal is played twice with the seats swapped and scored in signed levels per round from the candidate&#x27;s side, with a deal bootstrap. Screen bar: mean at least +0.005 and one-sided 80% lower bound above zero; confirmation bar: mean at least +0.005 and 95% lower bound above zero. Example cbaC, the release-50 candidate&#x27;s confirmation: +0.0618 [+0.0507, +0.0729] vs release 49 as served, CONFIRMED. Duel rows and the older MC-LCB windows rows are different instruments and do not add.">
