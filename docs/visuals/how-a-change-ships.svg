<text x="40.0" y="436.0" class="sm"><tspan class="b">screen</tspan>, 3,920 deals: mean ≥ +0.005 and one-sided 80% lower bound &gt; 0</text>
<text x="40.0" y="456.0" class="sm"><tspan class="b">confirmation</tspan>, 7,840 fresh deals: mean ≥ +0.005 and 95% lower bound &gt; 0</text>
<text x="40.0" y="476.0" class="sm mut">no common control: the candidate plays the served release directly</text>
<text x="520.0" y="224.0" class="sm mut">candidate − release 49, levels/round</text>
<line x1="520.0" y1="234.0" x2="520.0" y2="400.0" class="grid"/>
<text x="520.0" y="418.0" class="sm mut" text-anchor="middle">−0.02</text>
<line x1="590.0" y1="234.0" x2="590.0" y2="400.0" class="zero"/>
