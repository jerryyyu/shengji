<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 513" width="1000" height="513" role="img" aria-label="How a change ships: idea, then a cheap DEV test with a predeclared bar (offline agreement, double-dummy regret, or a head-to-head DEV duel, triage only), then a screen of 10 windows by 520 clusters on first-round deals where the candidate and the current release each play the same fixed MC-LCB control, positive if and only if the 95% CI lower bound is above zero, then a fresh-seed confirmation when Jerry or the packet requires one, a latency and memory gate on one core, a reviewed release PR with green CI, deploy on Jerry&#x27;s word, and a post-deploy Fly check.">
<rect x="0" y="0" width="1000" height="513" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,system-ui,sans-serif;font-size:12px;fill:#1e2833}.mut{fill:#5d6a77;font-size:11px}.hdr{font-size:11px;font-weight:600;letter-spacing:.07em;fill:#5d6a77}.big{font-size:13px;font-weight:600}.new{fill:#b4520f;font-weight:600}.teal{fill:#117a75;font-weight:600}.ttl{font-size:16px;font-weight:600}.tag{font-size:10px;font-weight:700;letter-spacing:.06em;fill:#ffffff}.num{font-variant-numeric:tabular-nums}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4f63"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4520f"/></marker></defs>
<text x="24" y="34" class="ttl">How a strength change ships (current workflow)</text>
<text x="24" y="53" class="mut">Each gate either passes the change forward or parks it with its numbers recorded on the board.</text>
<rect x="24.0" y="76.0" width="120.0" height="206.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="36.0" y="102.0" class="big">idea</text>
<text x="36.0" y="123.0" class="mut">a board row with</text>
<text x="36.0" y="138.0" class="mut">its pass bar</text>
<text x="36.0" y="153.0" class="mut">written before</text>
<text x="36.0" y="168.0" class="mut">the test runs</text>
<rect x="178.0" y="76.0" width="250.0" height="206.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="190.0" y="102.0" class="big">cheap DEV test</text>
<text x="190.0" y="124.0">predeclared bar: offline agreement,</text>
<text x="190.0" y="140.0">double-dummy regret, or a</text>
<text x="190.0" y="156.0">head-to-head DEV duel</text>
<text x="190.0" y="177.0" class="mut">Head-to-head reads ran 5–7× larger than</text>
<text x="190.0" y="192.0" class="mut">screens in recent lanes: triage only.</text>
<rect x="462" y="76" width="302" height="206" rx="6" fill="#e3f1ef" stroke="#117a75" stroke-width="1.8"/>
<text x="474" y="98" class="big">screen</text>
<text x="526" y="98" class="mut">10 windows × 520 clusters, first-round deals</text>
<rect x="482" y="116" width="120" height="30" rx="4" fill="#fcebd9" stroke="#b4520f" stroke-width="1.4"/>
<text x="542.0" y="135" text-anchor="middle">candidate</text>
<path d="M542.0,148 L542.0,193" fill="none" stroke="#3b4f63" stroke-width="1.3" stroke-dasharray="4 3"/>
<rect x="624" y="116" width="120" height="30" rx="4" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="684.0" y="135" text-anchor="middle">current release</text>
<path d="M684.0,148 L684.0,193" fill="none" stroke="#3b4f63" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="613.0" y="171" class="mut" text-anchor="middle">each plays the</text>
<text x="613.0" y="184" class="mut" text-anchor="middle">same deals vs</text>
<rect x="512" y="194" width="202" height="28" rx="4" fill="#e7ecf1" stroke="#3b4f63" stroke-width="1.4"/>
<text x="613.0" y="212" text-anchor="middle">fixed MC-LCB control</text>
<text x="474" y="252"><tspan class="teal">POSITIVE</tspan> iff the 95% CI lower bound of</text>
<text x="474" y="269">the difference (candidate minus release) is above 0</text>
<rect x="798.0" y="76.0" width="178.0" height="206.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="810.0" y="102.0" class="big">fresh-seed</text>
<text x="810.0" y="119.0" class="big">confirmation</text>
<text x="810.0" y="141.0">the same lane on new</text>
<text x="810.0" y="157.0">seeds</text>
<text x="810.0" y="178.0" class="mut">when Jerry or the packet</text>
<text x="810.0" y="193.0" class="mut">requires one</text>
<line x1="146.0" y1="106.0" x2="175.0" y2="106.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430.0" y1="106.0" x2="459.0" y2="106.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="766.0" y1="106.0" x2="795.0" y2="106.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24.0" y="316.0" width="220.0" height="95.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="36.0" y="342.0" class="big">latency + memory gate</text>
<text x="36.0" y="364.0">measured on one core: Fly runs</text>
<text x="36.0" y="380.0">shared-cpu-1x with 512 MB</text>
<rect x="278.0" y="316.0" width="210.0" height="95.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="290.0" y="342.0" class="big">release PR</text>
<text x="290.0" y="364.0">reviewed by the agent that did</text>
<text x="290.0" y="380.0">not write it, with every CI</text>
<text x="290.0" y="396.0">check green</text>
<rect x="522.0" y="316.0" width="190.0" height="95.0" rx="6" fill="#e7ecf1" stroke="#3b4f63" stroke-width="1.4"/>
<text x="534.0" y="342.0" class="big">deploy</text>
<text x="534.0" y="364.0">on Jerry&#x27;s word, after</text>
<text x="534.0" y="380.0">the required gates pass</text>
<rect x="746.0" y="316.0" width="230.0" height="95.0" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.4"/>
<text x="758.0" y="342.0" class="big">post-deploy Fly check</text>
<text x="758.0" y="364.0">confirm the live Fly app serves</text>
<text x="758.0" y="380.0">the reviewed release</text>
<line x1="246.0" y1="346.0" x2="275.0" y2="346.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490.0" y1="346.0" x2="519.0" y2="346.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="714.0" y1="346.0" x2="743.0" y2="346.0" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M936.0,284.0 L936.0,301.0 L64.0,301.0 L64.0,313.0" fill="none" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<text x="24" y="449">Why a common control: the candidate never plays the release directly. Both play the same fixed MC-LCB opponent on the same deals,</text>
<text x="24" y="466">so within one screen the two arms share a scale. Ladder rows are separate contrasts from different eras; they do not add.</text>
<text x="976" y="503" class="mut" text-anchor="end">2026-10-16 · docs/visuals/how-a-change-ships.svg</text>
</svg>
