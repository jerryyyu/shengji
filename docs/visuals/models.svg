<text x="124" y="377" class="labb" text-anchor="middle">+</text>
<text x="248" y="364" class="cap">1,115 public features →</text>
<text x="248" y="380" class="cap">MLP 2 × 256</text>
<path class="arrow" d="M244 371 H140" marker-end="url(#ah)"/>
<path class="arrow" d="M124 387 V398" marker-end="url(#ah)"/>
