<rect x="34" y="400" width="180" height="30" class="c-belief" fill-opacity="0.16" rx="6"/>
<text x="124" y="420" class="lab" text-anchor="middle">54 × 4 holder logits</text>
<text x="230" y="412" class="cap">next · partner ·</text>
<text x="230" y="428" class="cap">previous · kitty</text>
<path class="arrow" d="M124 431 V442" marker-end="url(#ah)"/>
<rect x="34" y="444" width="180" height="30" class="box b-belief" rx="6"/>
