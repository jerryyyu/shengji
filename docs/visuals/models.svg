<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 776" width="1200" height="776" role="img" aria-label="The models, three cards. Belief, B1a 028131a0, a transformer with 3.2M parameters: history tokens go through a causal 4-layer encoder of width 192 with 4 heads; 54 card queries cross-attend to it through 4 layers, then one card self-attention layer; a 2-layer MLP of width 256 over 1,115 public features is added; the output is 54 by 4 holder logits for next player, partner, previous player and kitty, masked and turned into probabilities by a softmax at temperature 1.019. Trained by the S58 fine-tune on 10.3M decisions from Y self-play; used in belief sampling and the bury worlds. Value, G3 Stage A f4f4127e, a residual MLP with 620k parameters: 833 inputs, 561 public features plus 5 by 54 deal counts plus 2 for perspective, a stem to width 165, 4 residual blocks of LayerNorm, a 330-wide ReLU layer and back to 165, a final LayerNorm and ReLU, and 204 outcome classes whose softmax gives the expected signed level. Trained with cross-entropy on 200k Y self-play rounds, warm from SMV3; used in the value pass, declare and bury. Prior, FT1 1fa201b2, the same residual MLP with a 54-card policy head: one root position per world gives 54 card log-odds, used raw with no softmax and summed per play; fine-tuned toward about 37.8k expert-search labels; used for candidates and lgf follows. All are trained in PyTorch, exported to .npz and run in NumPy on the server CPU; value positions go in batches of 128; on Fly a release 52 decision takes p95 0.855 seconds.">
<title>The models</title>
<style>.bg{fill:#1d242c}.box{fill:#151a20;stroke-width:1.5}.tile{fill:#151a20;stroke:#98a4b0;stroke-width:1}.h1{font:600 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.t{font:600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.s{font:15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.body{font:14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.cap{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.lab{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.labb{font:600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.num{font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#c3ccd5}.k{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.06em}.m{font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#98a4b0}.chipt{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.rule{stroke:#323c47}.arrow{stroke:#98a4b0;stroke-width:1.8;fill:none}.thin{stroke:#98a4b0;stroke-width:1.2;fill:none}.dash{stroke:#98a4b0;stroke-width:1.2;fill:none;stroke-dasharray:3 3}.ah{fill:#98a4b0}.bar{fill:#232c36;stroke:#4fc1b9;stroke-width:1.5}.chip{fill:#232c36;stroke-width:1}.ring{fill:none;stroke:#e6ebf0;stroke-width:1.5}.xm{stroke:#f08a80;stroke-width:2;stroke-linecap:round}.c-belief{fill:#b39cf0}.b-belief{stroke:#b39cf0}.c-prior{fill:#f2a46b}.b-prior{stroke:#f2a46b}.c-value{fill:#7fb8ef}.b-value{stroke:#7fb8ef}.c-exact{fill:#ef8fbe}.b-exact{stroke:#ef8fbe}.c-accent{fill:#4fc1b9}.b-accent{stroke:#4fc1b9}.c-bad{fill:#f08a80}.b-bad{stroke:#f08a80}.c-muted{fill:#98a4b0}.b-muted{stroke:#98a4b0}.c-fg{fill:#e6ebf0}.b-fg{stroke:#e6ebf0}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
