<line x1="432" y1="492" x2="776" y2="492" class="rule"/>
<text x="432" y="516" class="m c-value">TRAINED</text>
<text x="432" y="538" class="body">Cross-entropy on round outcomes</text>
<text x="432" y="557.5" class="body">from 200k Y self-play rounds, warm</text>
<text x="432" y="577" class="body">from SMV3's trunk.</text>
<text x="432" y="610.5" class="m c-value">USED IN</text>
