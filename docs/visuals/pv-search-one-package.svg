<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Release 29: one soft-head package is the whole play search; its policy head admits eight candidates over 64 sampled worlds, its value head prices each candidate's afterstate in every world, the highest mean plays; hybrid bury uses the same package.">
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:12px;fill:#1e2833}.mut{fill:#65727f;font-size:11px}.hdr{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#65727f}.big{font-size:13px;font-weight:600}.sm{font-size:11px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4f63"/></marker></defs>
<!-- column headers -->
<text x="100" y="22" class="hdr" text-anchor="middle">64 SAMPLED WORLDS</text>
<text x="300" y="22" class="hdr" text-anchor="middle">POLICY HEAD · ADMIT 8</text>
<text x="540" y="22" class="hdr" text-anchor="middle">VALUE HEAD · PRICE 8 × 64</text>
<text x="757" y="22" class="hdr" text-anchor="middle">MEAN OVER WORLDS</text>
<text x="925" y="22" class="hdr" text-anchor="middle">PLAY</text>
<!-- the one package spanning the two heads -->
<rect x="200" y="34" width="450" height="38" rx="6" fill="#d6ecea" stroke="#117a75" stroke-width="1.5"/>
<text x="425" y="50" class="big" text-anchor="middle" fill="#117a75">ONE NUMPY PACKAGE   soft-8ecd4fea.npz   (sha256 ccade130…)</text>
<text x="425" y="65" class="mut" text-anchor="middle">shared trunk · policy head + value head · no Torch, no playouts on the server</text>
<!-- worlds column -->
<g>
<rect x="34" y="104" width="120" height="30" rx="4" fill="#dfe5ec" stroke="#3b4f63" stroke-width="1.2"/>
<rect x="42" y="112" width="120" height="30" rx="4" fill="#dfe5ec" stroke="#3b4f63" stroke-width="1.2"/>
<rect x="50" y="120" width="120" height="30" rx="4" fill="#dfe5ec" stroke="#3b4f63" stroke-width="1.2"/>
<rect x="58" y="128" width="120" height="30" rx="4" fill="#ffffff" stroke="#3b4f63" stroke-width="1.5"/>
<text x="118" y="147" class="sm" text-anchor="middle">hidden hands, world 1…64</text>
<text x="100" y="184" class="mut" text-anchor="middle">production's sampler,</text>
<text x="100" y="198" class="mut" text-anchor="middle">void-checked, kitty aware</text>
<circle cx="100" cy="228" r="6" fill="#1e2833"/>
<text x="100" y="250" class="mut" text-anchor="middle">the real position</text>
</g>
<!-- admit -->
<g>
<rect x="205" y="96" width="190" height="150" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.5"/>
<text x="300" y="118" text-anchor="middle" class="big">the capped legal listing</text>
<text x="300" y="134" text-anchor="middle" class="mut">up to 4,000 actions + the</text>
<text x="300" y="148" text-anchor="middle" class="mut">forced heuristic anchor</text>
<text x="300" y="172" text-anchor="middle">scored in every world;</text>
<text x="300" y="188" text-anchor="middle">log-odds summed per action</text>
<text x="300" y="214" text-anchor="middle" class="big">anchor + 7 best → 8</text>
<text x="300" y="232" text-anchor="middle" class="mut">the anchor is always admitted</text>
</g>
<!-- price -->
<g>
<rect x="440" y="96" width="200" height="150" rx="6" fill="#ffffff" stroke="#117a75" stroke-width="1.5"/>
<text x="540" y="118" text-anchor="middle" class="big">each admitted play</text>
<text x="540" y="134" text-anchor="middle" class="mut">applied; the current trick</text>
<text x="540" y="148" text-anchor="middle" class="mut">finished heuristically</text>
<text x="540" y="172" text-anchor="middle">value head prices the</text>
<text x="540" y="188" text-anchor="middle">afterstate in all 64 worlds</text>
<text x="540" y="214" text-anchor="middle" class="big">512 forwards, batches of 128</text>
<text x="540" y="232" text-anchor="middle" class="mut">signed level utility, acting team</text>
</g>
<!-- mean -->
<g>
<rect x="685" y="96" width="145" height="150" rx="6" fill="#ffffff" stroke="#3b4f63" stroke-width="1.5"/>
<text x="757" y="122" text-anchor="middle" class="big">8 means</text>
<line x1="700" y1="136" x2="815" y2="136" stroke="#d5dae0"/>
<text x="757" y="160" text-anchor="middle">argmax</text>
<text x="757" y="192" text-anchor="middle" class="mut">no lower bound,</text>
<text x="757" y="206" text-anchor="middle" class="mut">no report fold,</text>
<text x="757" y="220" text-anchor="middle" class="mut">no Monte Carlo playouts</text>
</g>
<!-- play -->
<g>
<rect x="875" y="141" width="100" height="60" rx="30" fill="#f3e7cc" stroke="#a8741c" stroke-width="1.5"/>
<text x="925" y="166" text-anchor="middle" class="big">played</text>
<text x="925" y="183" text-anchor="middle" class="mut">≈0.25 s on Fly</text>
</g>
<!-- arrows -->
<line x1="180" y1="171" x2="201" y2="171" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="395" y1="171" x2="436" y2="171" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="171" x2="681" y2="171" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="830" y1="171" x2="871" y2="171" stroke="#3b4f63" stroke-width="1.6" marker-end="url(#a)"/>
<!-- budget + fallback -->
<text x="500" y="276" class="mut" text-anchor="middle">3 s cooperative budget: on expiry, or on any search error, the sampler's RNG is restored and the heuristic anchor plays</text>
<text x="500" y="291" class="mut" text-anchor="middle">(record pv-search-fallback-v1); otherwise the record is pv-search-decision-v1.</text>
<!-- bury row -->
<rect x="34" y="308" width="932" height="118" rx="6" fill="#f7f8f9" stroke="#d5dae0"/>
<text x="54" y="330" class="hdr">BURY · VALUE-GUIDED HYBRID, THE SAME PACKAGE</text>
<text x="54" y="352">heuristic candidates (32) → each scored by the package's value head on 32 model worlds</text>
<text x="54" y="368">→ MC selection over 32 worlds with 4 alternatives → 2 s budget, heuristic fallback.</text>
<text x="54" y="390" class="mut">Declare stays heuristic. Release 27/28's bury arm is unchanged; only the value net behind it is now the soft head.</text>
<text x="54" y="410" class="mut">Evidence: card play vs the release-28 package +0.086 [+0.042, +0.131]; served vs release 28 as served +0.049 [+0.003, +0.095], five clean windows.</text>
<text x="54" y="422" class="mut">Rollback: one line, SHENGJI_BOT back to the release-28 name.</text>
<text x="966" y="456" class="mut" text-anchor="end">release 29 · 2026-09-22 · docs/visuals/pv-search-one-package.svg</text>
</svg>
