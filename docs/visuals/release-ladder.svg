<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Step chart, by release, of each served change's measured step against its own comparator in signed levels per round, with 95% CI whiskers, and a line that adds the steps up as an arithmetic index. Dotted before release 29 (other instruments), solid for MC-LCB common-control screens from release 29 to 48, dashed for paired head-to-head duels from release 49. Callouts: release 22 +0.14, policy shortlist; release 25/27 +0.02, value model; release 29 +0.05, policy plus value search; release 30 not measured; release 36 +0.04, measured against release 30; release 44 +0.05, value-guided declare, first-round deals; release 46 +0.23, belief plus exact endgame; release 50 +0.06, new value, prior and belief, trained on 200k rounds; release 51 −0.01 on cloud, where the Ultra read, +0.008, disagrees; release 52 +0.04, search rules. An arithmetic index of separate measurements from different instruments, each against its own comparator (the confirmation where one exists, else the screen). It is not a measured or calibrated strength gap. Hollow markers: changes the ladder lists as not measured.">
<title>Release by release: each measured step</title>
<style>.bg{fill:#1d242c}.h1{font:600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.s{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.tick{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#98a4b0}.axis{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.rel{font:600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.note{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.grid{stroke:#323c47;stroke-width:1}.zero{stroke:#98a4b0;stroke-width:1.2}.line{stroke:#4fc1b9;stroke-width:2.5;fill:none}.ci{stroke:#e0b25a;stroke-width:2}.dot{fill:#4fc1b9}.hollow{fill:#1d242c;stroke:#98a4b0;stroke-width:1.8}.lead{stroke:#98a4b0;stroke-width:1;fill:none}.gap{stroke:#98a4b0;stroke-width:1.5}</style>
