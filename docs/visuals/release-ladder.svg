<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Step chart of cumulative bot strength in levels per round over MC-LCB, by release date, from 0 on 1 September 2026 to about 0.83 at release 52 on 9 November. Callouts mark the key steps: release 22, policy shortlist; release 25, value model; release 29, policy plus value search; release 44, value-guided declare; release 46, belief plus exact endgame, the biggest step; release 50, scaling win, retrained on 200k rounds; release 52, search rules. Steps are separate measurements, so the running sum is an approximation, not a single measured gap. MC-LCB screens through release 48, paired head-to-head duels from release 49.">
<title>Bot strength by release</title>
<style>.bg{fill:#1d242c}.h1{font:600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.s{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.tick{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#98a4b0}.axis{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.rel{font:600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6ebf0}.note{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c3ccd5}.grid{stroke:#323c47;stroke-width:1}.zero{stroke:#98a4b0;stroke-width:1.2}.line{stroke:#4fc1b9;stroke-width:2.5;fill:none;stroke-linejoin:round}.dot{fill:#151a20;stroke:#4fc1b9;stroke-width:2}.key{fill:#4fc1b9}.lead{stroke:#98a4b0;stroke-width:1;fill:none}</style>
