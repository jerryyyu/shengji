# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Manual strength-first deployment (2026-08-07): report-LCB replicated its
  # gain over mc-strong in S0a and S0b. This is not a terminal S0 promotion;
  # fresh collision-free confirmation remains required for the formal claim.
  # Roll back this exact setting to 'mc-strong' if production health regresses.
  SHENGJI_BOT = 'mc-s0-report-lcb'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
