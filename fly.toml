# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Jerry authorized shipping JS-M1 on 2026-09-15 23:4x ET (#425/#435): ONE package,
  # js-m1-0d17fd03.npz, is the reviewed NumPy export (schema v2 with the policy head,
  # PR #455) of the from-scratch joint net a5248cc5. It is both the value net and,
  # above 1,000 legal actions (top 256 per world), its own policy head is the prior
  # (kind joint-numpy). Hybrid bury unchanged (JS-M1 scores bury candidates too).
  # Prior-only rollback: remove the four SHENGJI_CWV_PRIOR_* lines and set
  # SHENGJI_BOT to the prior-less JS-M1 name the registry prints. Full rollback:
  # release 27 (M1 + prior v2; fly.toml of main 55f0029c..d31bd428) or release 24.
  # RELEASE 29 (Jerry 2026-09-21 ~17:4x ET: "I'm good to launch soft with w64 to prod"): the
  # policy/value search (#585) with the soft-action head 8ecd4fea exported as ONE NumPy package
  # soft-8ecd4fea.npz (schema v2 with the policy head): 64 sampled worlds, 8 admitted candidates,
  # value head in place of playouts; heuristic declare, value-guided hybrid bury. Evidence: +0.086 [+0.042, +0.131] vs
  # the release-28 package in card play on 800 matched deals (#553; atlas row 45); the four-model
  # family (#583) showed no head superior, soft has the largest point estimate. Rollback: set
  # SHENGJI_BOT back to the release-28 name below (its env keys are kept for exactly that).
  # RELEASE 36 (Jerry 2026-09-30 11:4x ET: "Let's deploy"): the SAME search, bury and budgets on the
  # gen-5 SMV3 OUTCOME head (run 3e89e86f: arm F's recipe with ONE change, the search-mean sidecar v3,
  # #658) exported as ONE NumPy package smv3out-491ee4bf.npz. Evidence (#663): as served vs release 30
  # as served, each vs the common MC-LCB control, five windows +0.0361 [+0.0015, +0.0707] (v36a) and the
  # predeclared fresh confirmation +0.0393 [+0.0033, +0.0752] (v36a2, 5/5 windows positive). The
  # value function is still the game-outcome head; the search-mean head served as the value function
  # read NEGATIVE (v36b) and is not shipped. Rollback: the release-30 line below (its package stays on
  # the volume) or the release-35 image.
  # RELEASE 30 name: pv-search-ccade130-w64-k8-r8bc573be-bury-hybrid-4f003f41e23e
  #   SHENGJI_PV_CKPT = '/data/models/soft-8ecd4fea.npz'
  #   SHENGJI_PV_SHA256 = 'ccade130f34ae61def540441ef997e8d41cef9df96f9683406bbba59ae4ccc75'
  # RELEASE 38 (Jerry 2026-10-03: "lets promote combo + lead anchor"): release 36's package, search,
  # bury and budgets UNCHANGED, with four search rules on: admission diversity, refusal constraints,
  # point tie-break (combo, #676 combo2: +0.0461 [+0.0242, +0.0681] vs release 36, fresh ten windows)
  # and the lead anchor (#694; v43cla: combo+la minus combo +0.0106 [+0.0006, +0.0205]). Rollback:
  # delete the four SHENGJI_PV_* rule lines below and restore the release-36 name:
  # RELEASE 36 name: pv-search-491ee4bf-w64-k8-r4a09aef5-bury-hybrid-355958b4db25
  # RELEASE 42 (Jerry 2026-10-06: "OK let's ship it"): release 38 plus the doomed-throw swap (#830,
  # -dts): on a lead whose throw the engine refuses in every sampled world with the same forced
  # component, play that component instead (same value, no public failed-throw notice). Evidence
  # v57dts (ten fresh windows vs release 38): -0.0002 [-0.0102, +0.0099], DEPLOY-ELIGIBLE (not
  # noninferiority); failed throws 12,239 -> 4,402 (-64%). Rollback: delete the
  # SHENGJI_PV_DOOMED_THROW_SWAP line and restore the release-38 name:
  # RELEASE 38 name: pv-search-491ee4bf-w64-k8-div-rc-tb-la-r7092480e-bury-hybrid-5517ddbd7457
  # RELEASE 43 (Jerry 2026-10-09: deploy "as a functional correctness fix" if the no-harm check
  # passes): the doomed-throw re-select (#946, -dtr) REPLACES the swap. When the selected lead is a
  # throw the swap would replace, neither the throw nor its forced component is played; the bot
  # re-selects among its remaining admitted leads with its own selection rules. A correctness fix
  # for leading a doomed throw's weakest component (YJQJ round 1), NOT a strength claim. Evidence
  # v67dtrg (ten fresh windows vs release 42 as served): -0.0004 [-0.0122, +0.0114], DEPLOY-ELIGIBLE
  # (not noninferiority; harm down to -0.0122 stays compatible); re-selected on 2.2% of decisions,
  # zero fallbacks (#707 issuecomment-6080113005). Rollback: replace the
  # SHENGJI_PV_DOOMED_THROW_RESELECT line with SHENGJI_PV_DOOMED_THROW_SWAP = '1' and restore the
  # release-42 name:
  # RELEASE 42 name: pv-search-491ee4bf-w64-k8-div-rc-tb-la-dts-r0f40c8b5-bury-hybrid-273fed4cd40d
  SHENGJI_BOT = 'pv-search-491ee4bf-w64-k8-div-rc-tb-la-dtr-r91979586-bury-hybrid-28570365d86b'
  SHENGJI_PV_ADMISSION_DIVERSITY = '1'
  SHENGJI_PV_REFUSAL_CONSTRAINTS = '1'
  SHENGJI_PV_TIEBREAK_POINTS = '1'
  SHENGJI_PV_LEAD_ANCHOR = '1'
  SHENGJI_PV_DOOMED_THROW_RESELECT = '1'
  SHENGJI_PV_CKPT = '/data/models/smv3out-491ee4bf.npz'
  SHENGJI_PV_SHA256 = '491ee4bf81abe783d14f1e004d31ceda1ff2679bd2e14b60a5a9fa96b57c2670'
  SHENGJI_PV_WORLDS = '64'
  SHENGJI_PV_CANDIDATES = '8'
  SHENGJI_PV_CAP = '4000'
  SHENGJI_PV_BATCH_SIZE = '128'
  # Cooperative play budget (heuristic anchor on expiry); single-thread W64/K8 measured 0.05 s
  # mean / 0.09 s max on the Mini, so 3 s is a ceiling, not an ETA.
  SHENGJI_PV_SERVING_BUDGET_SECONDS = '3'
  # Value-guided hybrid bury (release 27/28's arm, on this package's value head; Jerry: "we
  # should use value guided hybrid"): 32 candidates, 32 model worlds, 32 selection worlds,
  # 4 alternatives, 2 s cooperative budget with heuristic fallback.
  SHENGJI_PV_BURY_ARM = 'hybrid'
  SHENGJI_PV_BURY_SERVING_BUDGET_SECONDS = '2'
  # Release-28 keys retained for the one-line rollback (they register the shortlist name; unused otherwise).
  # RELEASE 28 name: mc-shortlist-0d17fd03-w32-r0d610b62-prior-0d17fd03-bury-hybrid-003c2abe49ff
  SHENGJI_CWV_SHORTLIST_CKPT = '/data/models/js-m1-0d17fd03.npz'
  SHENGJI_CWV_PRIOR_CKPT = '/data/models/js-m1-0d17fd03.npz'
  SHENGJI_CWV_PRIOR_SHA256 = '0d17fd03aee759cc8de50083c062e8b11a85bdd8cf2bdda95213b73f431fd747'
  SHENGJI_CWV_PRIOR_THRESHOLD = '1000'
  SHENGJI_CWV_PRIOR_TOP = '256'
  SHENGJI_CWV_BURY_ARM = 'hybrid'
  # Cooperative search time, not a bound on queue wait or in-flight operations.
  SHENGJI_CWV_BURY_SERVING_BUDGET_SECONDS = '2'
  OPENBLAS_NUM_THREADS = '1'
  OMP_NUM_THREADS = '1'
  SHENGJI_MODEL_SEARCH_CONCURRENCY = '1'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'
  # Optional creator-authenticated engineering rooms use separate excluded
  # logs; ordinary rooms already use W32 without an access code.
  SHENGJI_W32_TEST_ROOMS = '0'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
