# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Jerry authorized M1 + policy prior v2 on 2026-09-15 (#435): package 12ce4415 is
  # the reviewed NumPy export (schema v2, residual trunk; PR #441) of M1 3cb9cd62;
  # package b9ff76c9 is the NumPy export (PR #442) of policy prior v2 b6d928c5,
  # bound by SHA (PR #443) and applied above 10,000 legal actions, top 256 per world.
  # Hybrid bury (authorized September 9) is unchanged.
  # Prior-only rollback: remove the four SHENGJI_CWV_PRIOR_* lines and set
  # SHENGJI_BOT to mc-shortlist-12ce4415-w32-r55d379a3-bury-hybrid-<12> (the
  # prior-less M1 name, printed by the registry). Full rollback: the previous
  # release (fd6bb411 + hybrid, name in DEPLOY.md).
  SHENGJI_BOT = 'mc-shortlist-12ce4415-w32-r94c1cdbf-prior-b9ff76c9-bury-hybrid-629b031628ce'
  SHENGJI_CWV_SHORTLIST_CKPT = '/data/models/m1-12ce4415.npz'
  SHENGJI_CWV_PRIOR_CKPT = '/data/models/prior-v2-b9ff76c9.npz'
  SHENGJI_CWV_PRIOR_SHA256 = 'b9ff76c9038630ae80bd396f4565574c549a55e385ffd729c2521905b76f0e6c'
  SHENGJI_CWV_PRIOR_THRESHOLD = '10000'
  SHENGJI_CWV_PRIOR_TOP = '256'
  SHENGJI_CWV_BURY_ARM = 'hybrid'
  # Cooperative search time, not a bound on queue wait or in-flight operations.
  SHENGJI_CWV_BURY_SERVING_BUDGET_SECONDS = '2'
  OPENBLAS_NUM_THREADS = '1'
  OMP_NUM_THREADS = '1'
  SHENGJI_MODEL_SEARCH_CONCURRENCY = '1'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'
  # Optional creator-authenticated engineering rooms use separate excluded
  # logs; ordinary rooms already use W32 without an access code.
  SHENGJI_W32_TEST_ROOMS = '0'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
