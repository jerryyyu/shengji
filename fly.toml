# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # N=30. Strongest verified policy: +0.262 +/- 0.154 paired level utility over
  # N=10 on 504 preregistered clusters, null control -0.048 +/- 0.162. That
  # result is pinned to commit e3aeec1, not to current main.
  # N=60 was measured at -0.002 +/- 0.119, so 30 is the ceiling for this lever.
  # NOTE: this image does NOT build the Cython extension, so the server runs
  # the pure-Python engine — roughly 3x the per-decision cost of the compiled
  # numbers quoted in AI_POLICIES.md.
  SHENGJI_BOT = 'mc-strong'
  SHENGJI_LOG_DIR = '/data/logs'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
