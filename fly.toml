# Fly.io config — deploy with `fly launch --copy-config` then `fly deploy`.
# IMPORTANT: game state is in process memory. Keep exactly ONE machine and
# never enable autoscaling; auto_stop is off so games survive quiet periods.
app = "shengji"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  SHENGJI_BOT = "smart"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
