  SHENGJI_LOG_DIR = '/data/logs'
  # UI telemetry (api/telemetry.py): anonymous client events, a separate sink that
  # refuses to sit inside the game logs. Unset = telemetry off.
  SHENGJI_TELEMETRY_DIR = '/data/telemetry'
  # Accounts database (optional Google sign-in, docs/accounts.md) lives on the volume.
  SHENGJI_DATA_DIR = '/data'
  # Optional Google sign-in: the public OAuth client id (type Web) from the Google
  # Cloud console. Unset = the feature is off (no button, /api/auth/google is 404).
  # No client secret is used anywhere.
  GOOGLE_CLIENT_ID = '804081879262-h9te26ulofdij1nqrr7urbjec6vsbfes.apps.googleusercontent.com'
  # Optional creator-authenticated W32 engineering rooms with separate excluded logs; off.
  # Ordinary rooms serve SHENGJI_BOT above and need no access code.
  SHENGJI_W32_TEST_ROOMS = '0'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
