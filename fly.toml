# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Jerry authorized shipping JS-M1 on 2026-09-15 23:4x ET (#425/#435): ONE package,
  # js-m1-0d17fd03.npz, is the reviewed NumPy export (schema v2 with the policy head,
  # PR #455) of the from-scratch joint net a5248cc5. It is both the value net and,
  # above 1,000 legal actions (top 256 per world), its own policy head is the prior
  # (kind joint-numpy). Hybrid bury unchanged (JS-M1 scores bury candidates too).
  # Prior-only rollback: remove the four SHENGJI_CWV_PRIOR_* lines and set
  # SHENGJI_BOT to the prior-less JS-M1 name the registry prints. Full rollback:
  # release 27 (M1 + prior v2; fly.toml of main 55f0029c..d31bd428) or release 24.
  # RELEASE 29 (Jerry 2026-09-21 ~17:4x ET: "I'm good to launch soft with w64 to prod"): the
  # policy/value search (#585) with the soft-action head 8ecd4fea exported as ONE NumPy package
  # soft-8ecd4fea.npz (schema v2 with the policy head): 64 sampled worlds, 8 admitted candidates,
  # value head in place of playouts; heuristic declare, value-guided hybrid bury. Evidence: +0.086 [+0.042, +0.131] vs
  # the release-28 package in card play on 800 matched deals (#553; atlas row 45); the four-model
  # family (#583) showed no head superior, soft has the largest point estimate. Rollback: set
  # SHENGJI_BOT back to the release-28 name below (its env keys are kept for exactly that).
  SHENGJI_BOT = 'pv-search-ccade130-w64-k8-r8bc573be-bury-hybrid-4f003f41e23e'
  SHENGJI_PV_CKPT = '/data/models/soft-8ecd4fea.npz'
  SHENGJI_PV_SHA256 = 'ccade130f34ae61def540441ef997e8d41cef9df96f9683406bbba59ae4ccc75'
  SHENGJI_PV_WORLDS = '64'
  SHENGJI_PV_CANDIDATES = '8'
  SHENGJI_PV_CAP = '4000'
  SHENGJI_PV_BATCH_SIZE = '128'
  # Cooperative play budget (heuristic anchor on expiry); single-thread W64/K8 measured 0.05 s
  # mean / 0.09 s max on the Mini, so 3 s is a ceiling, not an ETA.
  SHENGJI_PV_SERVING_BUDGET_SECONDS = '3'
  # Value-guided hybrid bury (release 27/28's arm, on this package's value head; Jerry: "we
  # should use value guided hybrid"): 32 candidates, 32 model worlds, 32 selection worlds,
  # 4 alternatives, 2 s cooperative budget with heuristic fallback.
  SHENGJI_PV_BURY_ARM = 'hybrid'
  SHENGJI_PV_BURY_SERVING_BUDGET_SECONDS = '2'
  # Release-28 keys retained for the one-line rollback (they register the shortlist name; unused otherwise).
  # RELEASE 28 name: mc-shortlist-0d17fd03-w32-r0d610b62-prior-0d17fd03-bury-hybrid-003c2abe49ff
  SHENGJI_CWV_SHORTLIST_CKPT = '/data/models/js-m1-0d17fd03.npz'
  SHENGJI_CWV_PRIOR_CKPT = '/data/models/js-m1-0d17fd03.npz'
  SHENGJI_CWV_PRIOR_SHA256 = '0d17fd03aee759cc8de50083c062e8b11a85bdd8cf2bdda95213b73f431fd747'
  SHENGJI_CWV_PRIOR_THRESHOLD = '1000'
  SHENGJI_CWV_PRIOR_TOP = '256'
  SHENGJI_CWV_BURY_ARM = 'hybrid'
  # Cooperative search time, not a bound on queue wait or in-flight operations.
  SHENGJI_CWV_BURY_SERVING_BUDGET_SECONDS = '2'
  OPENBLAS_NUM_THREADS = '1'
  OMP_NUM_THREADS = '1'
  SHENGJI_MODEL_SEARCH_CONCURRENCY = '1'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'
  # Optional creator-authenticated engineering rooms use separate excluded
  # logs; ordinary rooms already use W32 without an access code.
  SHENGJI_W32_TEST_ROOMS = '0'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
