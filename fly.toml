# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Jerry authorized the all-user W32 default on 2026-09-08. Package fd6bb411
  # is the reviewed compact export of ACDEF v2 3cd27716 (PR #313).
  # Preserve the volume package; policy rollback is SHENGJI_BOT=mc-s0-report-lcb.
  SHENGJI_BOT = 'mc-shortlist-fd6bb411-w32-r55d379a3'
  SHENGJI_CWV_SHORTLIST_CKPT = '/data/models/w32-fd6bb411.npz'
  OPENBLAS_NUM_THREADS = '1'
  OMP_NUM_THREADS = '1'
  SHENGJI_MODEL_SEARCH_CONCURRENCY = '1'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'
  # Optional creator-authenticated engineering rooms use separate excluded
  # logs; ordinary rooms already use W32 without an access code.
  SHENGJI_W32_TEST_ROOMS = '0'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
