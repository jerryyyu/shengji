# fly.toml app configuration file generated for shengji on 2026-07-31T18:11:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shengji'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Current production strength incumbent. S0 may change this exact setting
  # only after its independent confirmation returns PROMOTE; SELECT NONE leaves
  # it untouched. The image builds the Cython extension below and /healthz
  # exposes both this policy name and whether the compiled engine activated.
  SHENGJI_BOT = 'mc-strong'
  # Compiled engine, built in the fastbuild stage. fast.py falls back to pure
  # Python if the .so is missing, so this is safe to set unconditionally.
  SHENGJI_FAST = '1'
  SHENGJI_LOG_DIR = '/data/logs'

[mounts]
  source = 'shengji_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
